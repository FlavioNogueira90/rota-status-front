<div class="layout">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand__logo">RS</div>
      <div class="brand__text">
        <div class="brand__title">Rota Status</div>
        <div class="brand__subtitle">{{ sidebarSubtitle() }}</div>
      </div>
    </div>

    <nav class="nav">

      <!-- ✅ ADMIN: só cadastros -->
      <ng-container *ngIf="isAdmin() || isOperador()">
        <div class="nav__section">CADASTROS</div>

        <a
          class="nav__item"
          routerLink="/usuarios"
          routerLinkActive="is-active"
        >
          <span class="dot"></span>
          Usuários
        </a>

        <a class="nav__item is-disabled" title="Em breve">
          <span class="dot"></span>
          Motoristas
        </a>

        <a class="nav__item is-disabled" title="Em breve">
          <span class="dot"></span>
          Veículos
        </a>

        <a class="nav__item is-disabled" title="Em breve">
          <span class="dot"></span>
          Manifestos
        </a>
      </ng-container>

      <!-- ✅ OPERADOR: monitoramento + novo manifesto -->
      <ng-container *ngIf="isOperador() || isAdmin()">
        <div class="nav__section">MONITORAMENTO</div>

        <a
          class="nav__item"
          routerLink="/manifestos"
          routerLinkActive="is-active"
          [routerLinkActiveOptions]="{ exact: true }"
        >
          <span class="dot"></span>
          Buscar Manifesto
        </a>

        <div class="nav__section">CADASTROS</div>

        <a class="nav__item is-disabled" title="Em breve">
          <span class="dot"></span>
          Motoristas
        </a>

        <a class="nav__item is-disabled" title="Em breve">
          <span class="dot"></span>
          Veículos
        </a>

        <a
          class="nav__item"
          routerLink="/manifestos/novo"
          routerLinkActive="is-active"
        >
          <span class="dot"></span>
          Novo Manifesto
        </a>
      </ng-container>

      <!-- ✅ MOTORISTA (futuro): meus manifestos -->
      <ng-container *ngIf="isMotorista()">
        <div class="nav__section">MINHA ROTA</div>

        <a class="nav__item is-disabled" title="Em breve">
          <span class="dot"></span>
          Meus Manifestos
        </a>

        <a class="nav__item is-disabled" title="Em breve">
          <span class="dot"></span>
          Entregas em andamento
        </a>
      </ng-container>

      <!-- ✅ botão sair sempre -->
      <div class="nav__section">CONTA</div>
      <button class="logout-btn" (click)="logout()">Sair</button>
    </nav>

    <div class="sidebar__footer">
      <div class="footer__line"></div>
      <div class="footer__text">
        <div class="muted">Ambiente</div>
        <b>Local</b>
      </div>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="topbar__left">
        <div class="topbar__title">{{ topbarTitle() }}</div>
        <div class="topbar__hint">{{ topbarHint() }}</div>
      </div>

      <div class="topbar__right">
        <span class="pill pill--ok">Backend online</span>
      </div>
    </header>

    <section class="content">
      <router-outlet></router-outlet>
    </section>
  </main>
</div>
